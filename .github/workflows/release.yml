# Publishes a release when a version tag such as v0.4.2 is pushed: runs the checks, builds skel
# for macOS and Linux on arm64 and x64, signs the Mac binaries on Macs, and only then makes the
# checksums and publishes the binaries with release notes.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  # The one place that says where releases are published. The install script and skel itself
  # download from the `base` line in install.sh, so to move releases change both. A repository
  # other than this one also needs a RELEASES_TOKEN secret that can write to it.
  RELEASES_REPO: skelcrew/skel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of history and its tags, as the release notes start at the last release.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # The tests start real tmux servers and real sandboxes. Ubuntu 24.04 stops bubblewrap
      # from making its namespaces unless that restriction is lifted.
      - run: |
          sudo apt-get update
          sudo apt-get install --yes tmux bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun scripts/build-release.ts "${GITHUB_REF_NAME#v}"
      # The one binary this runner can start. It proves the stamp reached a real build.
      - run: test "$(dist/skel-linux-x64 --version)" = "skel ${GITHUB_REF_NAME#v}"
      # Passing files between jobs only warns about a missing file unless told otherwise. The Mac
      # binaries go under a name the publish job never downloads, so an unsigned one can't ship.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-mac
          path: dist/skel-darwin-*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-linux
          path: |
            dist/skel-linux-*
            dist/notes.md
          if-no-files-found: error

  # Bun's cross-built Mac binaries carry a signature that fails verification, and macOS can kill
  # a binary when a page fails its check as it loads. An ad hoc signature needs no Apple account.
  # Each binary is signed on a Mac with its own CPU, as an arm64 Mac can't be relied on to start
  # an x64 one, and a binary nobody started proves nothing.
  sign:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { binary: skel-darwin-arm64, runner: macos-26 }
          - { binary: skel-darwin-x64, runner: macos-26-intel }
    env:
      BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-mac
          path: dist
      # Files passed between jobs lose their executable mode.
      - run: |
          chmod +x "dist/$BINARY"
          codesign --force --sign - "dist/$BINARY"
          codesign --verify --strict --verbose=2 "dist/$BINARY"
          test "$("dist/$BINARY" --version)" = "skel ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: publish-*
          merge-multiple: true
          path: dist
      # After signing, which changes the Mac binaries, or every Mac install fails its checksum.
      # The names are spelled out so a missing binary stops here, and without a folder in them
      # as the install script looks a binary up by its bare name.
      - run: |
          cd dist
          sha256sum skel-darwin-arm64 skel-darwin-x64 skel-linux-arm64 skel-linux-x64 > SHA256SUMS
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/skel-* dist/SHA256SUMS \
            --repo "$RELEASES_REPO" --title "skel ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
