# Runs `bun run check` on every pull request and on every push to main, so a PR shows whether its
# tests pass, whoever opened it. Agents' sandboxes can't always run the whole suite.
name: Check

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

# A new push to a PR makes its earlier run pointless, so that run stops.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and types, once.
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx biome ci . && bunx tsc --noEmit

  # The tests, split into four jobs that run at the same time.
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Real tmux servers and sandboxes, as before.
      - run: |
          sudo apt-get update
          sudo apt-get install --yes tmux bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun scripts/test.ts --shard=${{ matrix.shard }}/4

  # One result named "check", as before, so Skelcrew and any branch rule still find it.
  check:
    runs-on: ubuntu-26.04
    needs: [lint, test]
    if: always()
    steps:
      - run: test "${{ needs.lint.result }}" = success && test "${{ needs.test.result }}" = success
