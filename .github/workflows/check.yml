# Runs `bun run check` on every pull request and on every push to main, so a PR shows whether its
# tests pass, whoever opened it. Agents' sandboxes can't always run the whole suite.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes its earlier run pointless, so that run stops.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # The tests start real tmux servers and real sandboxes, set up as for a release: Ubuntu
      # 26.04 has the bubblewrap and tmux Skelcrew needs, and Ubuntu stops bubblewrap from making
      # its namespaces unless that restriction is lifted.
      - run: |
          sudo apt-get update
          sudo apt-get install --yes tmux bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run check
